spring:
  application:
    name: MoneyOwl
    security:
      jwt:
        secret-key: ${SECRET_KEY}
        expiration: 3600000 # 30 minutes (30 * 60 * 1000)
  main:
    debug: false

  #OpenFeign Configuration
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
      client:
        config:
          setuFeignClient:
            loggerLevel: FULL

  config:
    activate:
      on-profile: local

  #DB Url Config
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost/MONEYOWL
    # jdbc:postgresql://localhost/${DB_NAME}
    username: ${USER_NAME}
    password: ${PASSWORD}

  data:
    mongodb:
      uri: mongodb://${USERNAME}:${PASSWORD}@localhost:27017/AssetData?authSource=admin
      database: AssetData

  #Groq AI LLM Config
  ai:
    openai:
      api-key: "${GROQ_API_KEY}"
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7
  #JPA Properties
  jpa:
    hibernate:
      ddl-auto: none
      jdbc:
        batch_size: 50
        batch_versioned_data: true
      order_inserts: true
      order_update: true
      generate_statistics: true
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: false

  #Mail Config
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${USERNAME_OR_EMAIL}
    password: "${PASSWORD_OR_PASSKEY}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui-custom.html
    operationsSorter: method

twilio:
  account-sid: "${ACCOUNT_ID}"
  auth-token: "${AUTH_TOKEN}"
  from-number: "${DEFAULT_PURCHASED_MOB_NO}"

otp:
  expiry-minutes: 5
  max-attempts: 3

setu-aa:
  base:
    url: "https://fiu-sandbox.setu.co/v2"

  auth:
    url: "https://orgservice-prod.setu.co/v1/users/login"

  client: "bridge"
  clientID: "${CLIENT_ID}"
  grant_type: "client_credentials"
  secret: "${CLIENT_SECRET}"
  x-product-instance-id: "${X_PRODUCT_INSTANCE_ID}"