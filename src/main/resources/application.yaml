spring:
  application:
    name: MoneyOwl
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY}
        expiration: 3600000 # 30 minutes (30 * 60 * 1000)
  main:
    debug: false

  #OpenFeign Configuration
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
      client:
        config:
          setuFeignClient:
            loggerLevel: FULL


  #DB Url Config
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    mongodb:
      uri: mongodb://${HOST}:${PORT}/${DB_NAME}

  #Groq AI LLM Config
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL_NAME}
          temperature: 0.7
  #JPA Properties
  jpa:
    hibernate:
      ddl-auto: none
      jdbc:
        batch_size: 50
        batch_versioned_data: true
      order_inserts: true
      order_update: true
      generate_statistics: true
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    generate-ddl: false

  #Mail Config
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui-custom.html
    operationsSorter: method

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  from-number: ${SENDER_MOB_NO}

otp:
  expiry-minutes: ${EXP_IN_MIN}
  max-attempts: ${MAX_ATTEMPTS}

setu-aa:
  base:
    url: "https://fiu-sandbox.setu.co/v2"

  auth:
    url: "https://orgservice-prod.setu.co/v1/users/login"

  client: "${CLIENT_NAME}"
  clientID: "${CLIENT_ID}"
  grant_type: "client_credentials"
  secret: "${SECRET}"
  x-product-instance-id: "${PRODUCT_INSTANCE_ID}"

kind: Application
