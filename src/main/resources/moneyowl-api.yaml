          schema:
            type: integer
            format: int32
            example: 5
      responses:
        '200':
          description: Successfully retrieved net worth projection.
          content:
            application/json:
              schema:
                type: object
                description: Map<Year, Value>
                additionalProperties:
                  type: number
                example:
                  "2025": 67676578.50
                  "2026": 7878.00
