components:
  ####################### HEADER ##############################
  headers:
    x-correlation-id:
      description: Unique Identifier to trace the transaction
      schema:
        type: string

  ####################### RESPONSES ############################
  responses:
    '400':
      description: Bad Request. The Server was unable to process the request due to invalid request syntax.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '401':
      description: Unauthorized. Authentication is required or has failed.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '403':
      description: Forbidden. The server understood the request, but refuses to authorize it.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '404':
      description: Not Found. The requested resource could not be found.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '405':
      description: Method Not Allowed. The HTTP method is not supported for this resource.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '415':
      description: Unsupported Media Type. The request entity format is not supported by the server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '422':
      description: Unprocessable Entity. The request was well-formed but contains semantic errors.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '429':
      description: Too Many Requests. The client has sent too many requests in a given amount of time.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '500':
      description: Internal Server Error. The server encountered an unexpected condition.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '502':
      description: Bad Gateway. The server received an invalid response from an upstream server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '503':
      description: Service Unavailable. The server is currently unable to handle the request.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '504':
      description: Gateway Timeout. The server did not receive a timely response from an upstream server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

  ####################### COMMON SCHEMAS ############################
  schemas:
    error:
      type: object
      properties:
        title:
          description: Error title
          type: string
        detail:
          description: Detailed Error message
          type: string

    userRequest:
      description: User Entity Data Transfer Object
      type: object
      required:
        - fullName
        - email
        - address
        - mobNo
      properties:
        fullName:
          description: User full name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        email:
          description: User email address
          type: string
          format: email
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Email
          example: "user@example.com"
          maxLength: 255
        address:
          description: User address
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 255
        mobNo:
          description: User mobile number
          type: string
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Pattern(regexp = "^[0-9]{10,15}$", message = "Invalid mobile number format")
          example: "9876543210"
          minLength: 10
          maxLength: 15


    userResponse:
      description: User Entity Response
      type: object
      required:
        - userId
        - fullName
        - address
        - email
        - mobNo
        - isActive
        - isVerified
        - userType
        - roles
      properties:
        userId:
          description: User Id in DB
          type: integer
          format: int64
        fullName:
          description: User full name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        address:
          description: User address
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 255
        email:
          description: User email address
          type: string
          format: email
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Email
          example: "user@example.com"
          maxLength: 255
        mobNo:
          description: User mobile number
          type: string
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Pattern(regexp = "^[0-9]{10,15}$", message = "Invalid mobile number format")
          example: "9876543210"
          minLength: 10
          maxLength: 15
        isActive:
          description: Active or Inactive User Flag
          type: boolean
        isVerified:
          description: Verified or Unverified User Flag
          type: boolean
        userType:
          description: Type of User
          type: string
        roles:
          description: User's Role's
          type: array
          items:
            type: string

    signupRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        password:
          type: string
        address:
          type: string
        mobNo:
          type: string

    emailLoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    otpRequest:
      type: object
      required:
        - identifier
        - otp
      properties:
        identifier:
          type: string
        otp:
          type: string
          description: 6 digit OTP sent to the mobile number
          example: "482931"
          pattern: "^\\d{6}$"

    otpCacheModel:
      type: object
      description: Internal OTP cache entry stored in Caffeine
      properties:
        otp:
          type: string
          description: Generated OTP
          example: "482931"
        attempts:
          type: integer
          format: int32
          description: Number of failed verification attempts
          example: 1
          minimum: 0
          maximum: 3
        createdAt:
          type: string
          format: date-time
          description: OTP creation timestamp
          example: "2026-02-08T10:15:30Z"

    loginResponse:
      type: object
      properties:
        jwtToken:
          type: string
        refreshToken:
          type: string
        message:
          type: string

    ########### SETU-AUTH MODELs ##########

    setuAuthTokenRequest:
      type: object
      properties:
        clientID:
          type: string
        grant_type:
          type: string
        secret:
          type: string

    setuAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    ########### SETU-CONSENT MODELs ##########

    consentRequestUIResponse:
      type: object
      description: Response of create consent request response send to the UI.
      properties:
        url:
          type: string
          format: uri
          description: The webview URL to redirect the user to for consent approval
          example: "https://fiu-uat.setu.co/v2/consents/webview/cffe6e11-7277-498c-a370-f436276f4fc0"
        fiTypes:
          type: array
          description: Financial Information types requested
          items:
            type: string

    createConsentResponse:
      type: object
      description: Response model for a create consent request in the Setu AA Sandbox
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"

        url:
          type: string
          format: uri
          description: The webview URL to redirect the user to for consent approval
          example: "https://fiu-uat.setu.co/v2/consents/webview/cffe6e11-7277-498c-a370-f436276f4fc0"

        status:
          type: string
          description: Current status of the consent
          #          enum: [ PENDING, ACTIVE, REJECTED, REVOKED, PAUSED ]
          example: "PENDING"

        detail:
          description: Detailed parameters of the requested consent
          $ref: '#/components/schemas/consentDetail'

        redirectUrl:
          type: string
          format: uri
          description: URL where the AA will redirect the user back after approval/rejection
          example: "https://app.moneyowl.com/aa/consent-callback"

        context:
          type: array
          description: Additional contextual metadata
          items:
            type: object
            additionalProperties: true

        PAN:
          type: string
          description: Permanent Account Number (if passed)
          example: "AHIP7878F"

        usage:
          type: object
          description: Tracks how many times data has been fetched using this consent
          $ref: '#/components/schemas/consentUsage'

        accountsLinked:
          type: array
          description: Array of accounts linked to this consent (populated after approval)
          items:
            type: object
            additionalProperties: true

        tags:
          type: array
          description: Tags associated with the consent
          items:
            type: string

        traceId:
          type: string
          description: Identifier for tracing API calls through the SETU/AA system
          example: "1-699a9b0e-7e60308c0a2ebfae73567fbc"

    getConsentResponse:
      type: object
      description: Response model for a GET consent request in the Setu AA Sandbox
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"

        url:
          type: string
          format: uri
          description: The webview URL to redirect the user to for consent approval
          example: "https://fiu-uat.setu.co/v2/consents/webview/cffe6e11-7277-498c-a370-f436276f4fc0"

        status:
          type: string
          description: Current status of the consent
          #          enum: [ PENDING, ACTIVE, REJECTED, REVOKED, PAUSED ]
          example: "PENDING"

        detail:
          description: Detailed parameters of the requested consent
          $ref: '#/components/schemas/consentDetail'

        redirectUrl:
          type: string
          format: uri
          description: URL where the AA will redirect the user back after approval/rejection
          example: "https://app.moneyowl.com/aa/consent-callback"

        context:
          type: array
          description: Additional contextual metadata
          items:
            type: object
            additionalProperties: true

        PAN:
          type: string
          description: Permanent Account Number (if passed)
          example: "AHIP7878F"

        usage:
          type: object
          description: Tracks how many times data has been fetched using this consent
          $ref: '#/components/schemas/consentUsage'

        accountsLinked:
          type: array
          description: Array of accounts linked to this consent (populated after approval)
          items:
            type: object
            additionalProperties: true

        tags:
          type: array
          description: Tags associated with the consent
          items:
            type: string

        traceId:
          type: string
          description: Identifier for tracing API calls through the SETU/AA system
          example: "1-699a9b0e-7e60308c0a2ebfae73567fbc"

    createConsentRequest:
      type: object
      required:
        - consentDuration
        - vua
        - dataRange
        - fiTypes
      properties:

        consentDuration:
          $ref: '#/components/schemas/consentDuration'

        vua:
          type: string
          example: 999999999@onemoney
          description: Virtual User Address issued by AA

        dataRange:
          $ref: '#/components/schemas/dataRange'

        fiTypes:
          type: array
          description: Financial Information types requested
          items:
            type: string

        context:
          type: array
          description: Additional consent context (optional in sandbox)
          items:
            type: object

    createDataFetchRequest:
      type: object
      required:
        - consentId
        - dataRange
        - format
      properties:
        consentId:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"

        dataRange:
          $ref: '#/components/schemas/dataRange'

        format:
          type: string
          description: Response Format
          example: "json"

    createDataFetchResponse:
      type: object
      description: Response model for a create data fetch request in the Setu AA Sandbox
      properties:
        id:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"
        status:
          type: string
          description: Current status of the consent
          #          enum: [ PENDING, ACTIVE, REJECTED, REVOKED, PAUSED ]
          example: "PENDING"
        dataRange:
          type: object
          description: Date range for which financial data is requested
          $ref: '#/components/schemas/dataRange'
        format:
          type: string
          description: Response Format
          example: "json"
        consentId:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"
        traceId:
          type: string
          description: Identifier for tracing API calls through the SETU/AA system
          example: "1-699a9b0e-7e60308c0a2ebfae73567fbc"

    consentDuration:
      type: object
      required:
        - unit
        - value
      properties:
        unit:
          type: string
          example: "MONTH"

        value:
          type: string
          example: "24"

    consentDetail:
      properties:
        consentStart:
          type: string
          format: string
          example: "2026-02-22T05:58:38.274Z"

        consentMode:
          type: string
          #          enum: [ STORE, VIEW, STORE_VIEW ]
          example: "STORE"

        fetchType:
          type: string
          #          enum: [ ONETIME, PERIODIC ]
          example: "PERIODIC"

        purpose:
          type: object
          $ref: '#/components/schemas/purpose'

        vua:
          type: string
          description: Virtual User Address (AA ID)
          example: "9833756340@onemoney"

        frequency:
          type: object
          description: Frequency of data fetch
          $ref: '#/components/schemas/frequency'

        consentTypes:
          type: array
          items:
            type: string
          #            enum: [ PROFILE, SUMMARY, TRANSACTIONS ]
          example: [ "PROFILE", "SUMMARY", "TRANSACTIONS" ]

        dataLife:
          type: object
          description: Duration for which the FIU can store the data
          $ref: '#/components/schemas/dataLife'

        fiTypes:
          type: array
          description: List of Financial Information Types
          items:
            type: string
            example: "DEPOSIT"
          example: [ "DEPOSIT" ]

        dataRange:
          type: object
          description: Date range for which financial data is requested
          $ref: '#/components/schemas/dataRange'

        consentExpiry:
          type: string
          example: "2028-02-22T05:58:38.274Z"


    purpose:
      type: object
      properties:
        category:
          type: object
          properties:
            type:
              type: string
              example: "string"
        code:
          type: string
          description: ReBIT purpose code
          example: "101"
        refUri:
          type: string
          format: uri
          example: "https://api.rebit.org.in/aa/purpose/101.xml"
        text:
          type: string
          example: "We request access to your financial information only to help you view and manage your wealth in one place. Your data is shared securely with your consent and is never accessed without your approval."


    frequency:
      type: object
      properties:
        unit:
          type: string
          #          enum: [ HOUR, DAY, MONTH, YEAR ]
          example: "DAY"
        value:
          type: integer
          example: 1

    dataLife:
      type: object
      properties:
        unit:
          type: string
          #          enum: [ MONTH, YEAR, DAY ]
          example: "YEAR"
        value:
          type: integer
          example: 1

    dataRange:
      type: object
      properties:
        from:
          type: string
          example: "2022-12-01T00:00:00.000Z"
        to:
          type: string
          example: "2023-08-12T00:00:00.000Z"


    consentUsage:
      type: object
      properties:
        lastUsed:
          type: string
          nullable: true
          example: null
        count:
          type: string
          example: "0"
