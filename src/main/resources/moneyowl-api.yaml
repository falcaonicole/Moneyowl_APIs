  ####################### GrowthRate APIs #####################
  '/get/individualAssetGrowth/{userId}/{duration}':
    get:
      tags:
        - AssetGrowthRate
      summary: Retrieve Individual Asset Growth Rate
      description: Fetches the projected growth rate and details for individual assets in the user's portfolio over a specified duration using path parameters.
      operationId: getIndividualAssetGrowthRate
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user (Long).
          schema:
            type: integer
            format: int64
            example: 1001
        - name: duration
          in: path
          required: true
          description: The projection duration in years (Integer).
          schema:
            type: integer
            format: int32
            example: 5
      responses:
        '200':
          description: Successfully retrieved asset growth rates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/portfolioResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
