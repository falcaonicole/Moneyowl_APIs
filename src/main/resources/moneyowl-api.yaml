components:
  ####################### HEADER ##############################
  headers:
    x-correlation-id:
      description: Unique Identifier to trace the transaction
      schema:
        type: string

  ####################### RESPONSES ############################
  responses:
    '400':
      description: Bad Request. The Server was unable to process the request due to invalid request syntax.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '401':
      description: Unauthorized. Authentication is required or has failed.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '403':
      description: Forbidden. The server understood the request, but refuses to authorize it.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '404':
      description: Not Found. The requested resource could not be found.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '405':
      description: Method Not Allowed. The HTTP method is not supported for this resource.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '415':
      description: Unsupported Media Type. The request entity format is not supported by the server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '422':
      description: Unprocessable Entity. The request was well-formed but contains semantic errors.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '429':
      description: Too Many Requests. The client has sent too many requests in a given amount of time.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '500':
      description: Internal Server Error. The server encountered an unexpected condition.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '502':
      description: Bad Gateway. The server received an invalid response from an upstream server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '503':
      description: Service Unavailable. The server is currently unable to handle the request.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '504':
      description: Gateway Timeout. The server did not receive a timely response from an upstream server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

  ####################### COMMON SCHEMAS ############################
  schemas:
    error:
      type: object
      properties:
        title:
          description: Error title
          type: string
        detail:
          description: Detailed Error message
          type: string

    userDTO:
      description: User Entity Data Transfer Object
      type: object
      required:
        - firstName
        - lastName
        - email
        - address
        - mobNo
        - password
      properties:
        firstName:
          description: User first name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        lastName:
          description: User last name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        email:
          description: User email address
          type: string
          format: email
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Email
          example: "user@example.com"
          maxLength: 255
        address:
          description: User address
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 255
        mobNo:
          description: User mobile number
          type: string
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Pattern(regexp = "^[0-9]{10,15}$", message = "Invalid mobile number format")
          example: "9876543210"
          minLength: 10
          maxLength: 15
        password:
          description: User account password
          type: string
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Size(min = 8, max = 64)
          example: "StrongP@ssw0rd"
          minLength: 8
          maxLength: 64

    userResponse:
      description: User Entity Response
      type: object
      required:
        - userId
        - firstName
        - lastName
        - email
        - address
        - mobNo
        - isActive
        - isVerified
        - userType
      properties:
        userId:
          description: User Id in DB
          type: long
        firstName:
          description: User first name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        lastName:
          description: User last name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        email:
          description: User email address
          type: string
          format: email
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Email
          example: "user@example.com"
          maxLength: 255
        address:
          description: User address
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 255
        mobNo:
          description: User mobile number
          type: string
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Pattern(regexp = "^[0-9]{10,15}$", message = "Invalid mobile number format")
          example: "9876543210"
