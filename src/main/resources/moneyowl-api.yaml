  ####################### LIABILITY APIs #####################

  ####################### GrowthRate APIs #####################

  ####################### AUTH APIs ############################
  '/auth/register':
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user record and sends an OTP to the provided email.
      operationId: registerUser
      requestBody:
        required: true
        content:
