openapi: 3.0.1

info:
  version: 2.0.0
  title: MoneyOwl
  description: MoneyOwl APIs for personal finance management.

paths:
  ###################### UserController APIs ####################################
  '/create/user':
    post:
      tags:
        - User
      summary: Create and save a new User in DB.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userRequest'
      responses:
        '201':
          description: Created a new User Successfully and returns newly added User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

  '/users/{userId}':
    get:
      tags:
        - User
      summary: Get user by ID
      description: Retrieves user details for the specified user ID.
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved user details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

    put:
      tags:
        - User
      summary: Update existing user
      description: Updates user details for the specified user ID.
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: User details to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userRequest'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                type: string
                example: "User updated successfully."
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

    delete:
      tags:
        - User
      summary: Delete user by ID
      description: Deletes the specified user from the system.
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user to delete
          schema:
            type: long
      responses:
        '200':
          description: User deleted successfully.
          content:
            application/json:
              schema:
                type: string
                example: "User deleted successfully."
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

  ###################### PORTFOLIO APIs ########################

  ####################### LIABILITY APIs #####################

  ####################### GrowthRate APIs #####################

  ####################### AUTH APIs ############################
  '/auth/register':
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user record and sends an OTP to the provided email.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signupRequest'
      responses:
        '201':
          description: Registration successful
          content:
            text/plain:
              schema:
                type: string
                example: "User registered successfully. Please check email for OTP."
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

  '/auth/login/email':
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user with their registered Email and returns a JWT token if the account is verified.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/emailLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

  '/auth/send/otp':
    get:
      tags:
        - Authentication
      summary: Send Email/Mob No OTP to User
      operationId: sendOtp
      parameters:
        - name: otpType
          in: path
          required: true
          description: OTP Type. 0 is mobno 1 is email
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OTP send to user.
          content:
            text/plain:
              schema:
                type: string
                example: "OTP send successfully."
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

  '/auth/verify/email-otp':
    post:
      tags:
        - Authentication
      summary: Verify Email OTP
      description: Verifies the OTP sent to the user's email to activate the account.
      operationId: verifyEmailOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otpRequest'
      responses:
        '200':
          description: Verification successful
          content:
            text/plain:
              schema:
                type: string
                example: "Account verified successfully."
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'

  '/auth/verify/mobno-otp':
    post:
      tags:
        - Authentication
      summary: Verify Mobile Number OTP
      description: Verifies the OTP sent to the user's Mobile No to activate the account.
      operationId: verifyMobOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/otpRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'
  ############## SurvivalMode APIs #############################

  ######################## LifeGoals API'S ##########################




components:
  ####################### HEADER ##############################
  headers:
    x-correlation-id:
      description: Unique Identifier to trace the transaction
      schema:
        type: string

  ####################### RESPONSES ############################
  responses:
    '400':
      description: Bad Request. The Server was unable to process the request due to invalid request syntax.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '401':
      description: Unauthorized. Authentication is required or has failed.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '403':
      description: Forbidden. The server understood the request, but refuses to authorize it.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '404':
      description: Not Found. The requested resource could not be found.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '405':
      description: Method Not Allowed. The HTTP method is not supported for this resource.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '415':
      description: Unsupported Media Type. The request entity format is not supported by the server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '422':
      description: Unprocessable Entity. The request was well-formed but contains semantic errors.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '429':
      description: Too Many Requests. The client has sent too many requests in a given amount of time.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '500':
      description: Internal Server Error. The server encountered an unexpected condition.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '502':
      description: Bad Gateway. The server received an invalid response from an upstream server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '503':
      description: Service Unavailable. The server is currently unable to handle the request.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    '504':
      description: Gateway Timeout. The server did not receive a timely response from an upstream server.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/x-correlation-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

  ####################### COMMON SCHEMAS ############################
  schemas:
    error:
      type: object
      properties:
        title:
          description: Error title
          type: string
        detail:
          description: Detailed Error message
          type: string

    userRequest:
      description: User Entity Data Transfer Object
      type: object
      required:
        - fullName
        - email
        - address
        - mobNo
      properties:
        fullName:
          description: User full name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        email:
          description: User email address
          type: string
          format: email
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Email
          example: "user@example.com"
          maxLength: 255
        address:
          description: User address
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 255
        mobNo:
          description: User mobile number
          type: string
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Pattern(regexp = "^[0-9]{10,15}$", message = "Invalid mobile number format")
          example: "9876543210"
          minLength: 10
          maxLength: 15


    userResponse:
      description: User Entity Response
      type: object
      required:
        - userId
        - fullName
        - address
        - email
        - mobNo
        - isActive
        - isVerified
        - userType
        - roles
      properties:
        userId:
          description: User Id in DB
          type: integer
          format: int64
        fullName:
          description: User full name
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 150
        address:
          description: User address
          type: string
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          minLength: 1
          maxLength: 255
        email:
          description: User email address
          type: string
          format: email
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Email
          example: "user@example.com"
          maxLength: 255
        mobNo:
          description: User mobile number
          type: string
          x-field-extra-annotation: |
            @jakarta.validation.constraints.NotBlank
            @jakarta.validation.constraints.Pattern(regexp = "^[0-9]{10,15}$", message = "Invalid mobile number format")
          example: "9876543210"
          minLength: 10
          maxLength: 15
        isActive:
          description: Active or Inactive User Flag
          type: boolean
        isVerified:
          description: Verified or Unverified User Flag
          type: boolean
        userType:
          description: Type of User
          type: string
        roles:
          description: User's Role's
          type: array
          items:
            type: string

    signupRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        password:
          type: string
        address:
          type: string
        mobNo:
          type: string

    emailLoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    otpRequest:
      type: object
      required:
        - identifier
        - otp
      properties:
        identifier:
          type: string
        otp:
          type: string
          description: 6 digit OTP sent to the mobile number
          example: "482931"
          pattern: "^\\d{6}$"

    otpCacheModel:
      type: object
      description: Internal OTP cache entry stored in Caffeine
      properties:
        otp:
          type: string
          description: Generated OTP
          example: "482931"
        attempts:
          type: integer
          format: int32
          description: Number of failed verification attempts
          example: 1
          minimum: 0
          maximum: 3
        createdAt:
          type: string
          format: date-time
          description: OTP creation timestamp
          example: "2026-02-08T10:15:30Z"

    loginResponse:
      type: object
      properties:
        jwtToken:
          type: string
        refreshToken:
          type: string
        message:
          type: string

    ########### SETU-AUTH MODELs ##########

    setuAuthTokenRequest:
      type: object
      properties:
        clientID:
          type: string
        grant_type:
          type: string
        secret:
          type: string

    setuAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    ########### SETU-CONSENT MODELs ##########

    consentRequestUIResponse:
      type: object
      description: Response of create consent request response send to the UI.
      properties:
        url:
          type: string
          format: uri
          description: The webview URL to redirect the user to for consent approval
          example: "https://fiu-uat.setu.co/v2/consents/webview/cffe6e11-7277-498c-a370-f436276f4fc0"
        fiTypes:
          type: array
          description: Financial Information types requested
          items:
            type: string

    createConsentResponse:
      type: object
      description: Response model for a create consent request in the Setu AA Sandbox
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"

        url:
          type: string
          format: uri
          description: The webview URL to redirect the user to for consent approval
          example: "https://fiu-uat.setu.co/v2/consents/webview/cffe6e11-7277-498c-a370-f436276f4fc0"

        status:
          type: string
          description: Current status of the consent
          #          enum: [ PENDING, ACTIVE, REJECTED, REVOKED, PAUSED ]
          example: "PENDING"

        detail:
          type: object
          description: Detailed parameters of the requested consent
          $ref: '#/components/schemas/consentDetail'

        redirectUrl:
          type: string
          format: uri
          description: URL where the AA will redirect the user back after approval/rejection
          example: "https://app.moneyowl.com/aa/consent-callback"

        context:
          type: array
          description: Additional contextual metadata
          items:
            type: object
            additionalProperties: true

        PAN:
          type: string
          description: Permanent Account Number (if passed)
          example: "AHIP7878F"

        usage:
          type: object
          description: Tracks how many times data has been fetched using this consent
          $ref: '#/components/schemas/consentUsage'

        accountsLinked:
          type: array
          description: Array of accounts linked to this consent (populated after approval)
          items:
            type: object
            additionalProperties: true

        tags:
          type: array
          description: Tags associated with the consent
          items:
            type: string

        traceId:
          type: string
          description: Identifier for tracing API calls through the SETU/AA system
          example: "1-699a9b0e-7e60308c0a2ebfae73567fbc"

    getConsentResponse:
      type: object
      description: Response model for a GET consent request in the Setu AA Sandbox
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"

        url:
          type: string
          format: uri
          description: The webview URL to redirect the user to for consent approval
          example: "https://fiu-uat.setu.co/v2/consents/webview/cffe6e11-7277-498c-a370-f436276f4fc0"

        status:
          type: string
          description: Current status of the consent
          #          enum: [ PENDING, ACTIVE, REJECTED, REVOKED, PAUSED ]
          example: "PENDING"

        detail:
          type: object
          description: Detailed parameters of the requested consent
          $ref: '#/components/schemas/consentDetail'

        redirectUrl:
          type: string
          format: uri
          description: URL where the AA will redirect the user back after approval/rejection
          example: "https://app.moneyowl.com/aa/consent-callback"

        context:
          type: array
          description: Additional contextual metadata
          items:
            type: object
            additionalProperties: true

        PAN:
          type: string
          description: Permanent Account Number (if passed)
          example: "AHIP7878F"

        usage:
          type: object
          description: Tracks how many times data has been fetched using this consent
          $ref: '#/components/schemas/consentUsage'

        accountsLinked:
          type: array
          description: Array of accounts linked to this consent (populated after approval)
          items:
            type: object
            additionalProperties: true

        tags:
          type: array
          description: Tags associated with the consent
          items:
            type: string

        traceId:
          type: string
          description: Identifier for tracing API calls through the SETU/AA system
          example: "1-699a9b0e-7e60308c0a2ebfae73567fbc"

    createConsentRequest:
      type: object
      required:
        - consentDuration
        - vua
        - dataRange
        - fiTypes
      properties:

        consentDuration:
          $ref: '#/components/schemas/consentDuration'

        vua:
          type: string
          example: 999999999@onemoney
          description: Virtual User Address issued by AA

        dataRange:
          $ref: '#/components/schemas/dataRange'

        fiTypes:
          type: array
          description: Financial Information types requested
          items:
            type: string

        context:
          type: array
          description: Additional consent context (optional in sandbox)
          items:
            type: object

    createDataFetchRequest:
      type: object
      required:
        - consentId
        - dataRange
        - format
      properties:
        consentId:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"

        dataRange:
          $ref: '#/components/schemas/dataRange'

        format:
          type: string
          description: Response Format
          example: "json"

    createDataFetchResponse:
      type: object
      description: Response model for a create data fetch request in the Setu AA Sandbox
      properties:
        id:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"
        status:
          type: string
          description: Current status of the consent
          #          enum: [ PENDING, ACTIVE, REJECTED, REVOKED, PAUSED ]
          example: "PENDING"
        dataRange:
          type: object
          description: Date range for which financial data is requested
          $ref: '#/components/schemas/dataRange'
        format:
          type: string
          description: Response Format
          example: "json"
        consentId:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"
        traceId:
          type: string
          description: Identifier for tracing API calls through the SETU/AA system
          example: "1-699a9b0e-7e60308c0a2ebfae73567fbc"

    consentDuration:
      type: object
      required:
        - unit
        - value
      properties:
        unit:
          type: string
          example: "MONTH"

        value:
          type: string
          example: "24"

    consentDetail:
      type: object
      properties:
        consentStart:
          type: string
          format: string
          example: "2026-02-22T05:58:38.274Z"

        consentMode:
          type: string
          #          enum: [ STORE, VIEW, STORE_VIEW ]
          example: "STORE"

        fetchType:
          type: string
          #          enum: [ ONETIME, PERIODIC ]
          example: "PERIODIC"

        purpose:
          type: object
          $ref: '#/components/schemas/purpose'

        vua:
          type: string
          description: Virtual User Address (AA ID)
          example: "9833756340@onemoney"

        frequency:
          type: object
          description: Frequency of data fetch
          $ref: '#/components/schemas/frequency'

        consentTypes:
          type: array
          items:
            type: string
          #            enum: [ PROFILE, SUMMARY, TRANSACTIONS ]
          example: [ "PROFILE", "SUMMARY", "TRANSACTIONS" ]

        dataLife:
          type: object
          description: Duration for which the FIU can store the data
          $ref: '#/components/schemas/dataLife'

        fiTypes:
          type: array
          description: List of Financial Information Types
          items:
            type: string
            example: "DEPOSIT"
          example: [ "DEPOSIT" ]

        dataRange:
          type: object
          description: Date range for which financial data is requested
          $ref: '#/components/schemas/dataRange'

        consentExpiry:
          type: string
          example: "2028-02-22T05:58:38.274Z"


    purpose:
      type: object
      properties:
        category:
          type: object
          properties:
            type:
              type: string
              example: "string"
        code:
          type: string
          description: ReBIT purpose code
          example: "101"
        refUri:
          type: string
          format: uri
          example: "https://api.rebit.org.in/aa/purpose/101.xml"
        text:
          type: string
          example: "We request access to your financial information only to help you view and manage your wealth in one place. Your data is shared securely with your consent and is never accessed without your approval."


    frequency:
      type: object
      properties:
        unit:
          type: string
          #          enum: [ HOUR, DAY, MONTH, YEAR ]
          example: "DAY"
        value:
          type: integer
          example: 1

    dataLife:
      type: object
      properties:
        unit:
          type: string
          #          enum: [ MONTH, YEAR, DAY ]
          example: "YEAR"
        value:
          type: integer
          example: 1

    dataRange:
      type: object
      properties:
        from:
          type: string
          example: "2022-12-01T00:00:00.000Z"
        to:
          type: string
          example: "2023-08-12T00:00:00.000Z"


    consentUsage:
      type: object
      properties:
        lastUsed:
          type: string
          nullable: true
          example: null
        count:
          type: string
          example: "0"
    ######################### SETU-FI-MODELs #######################

    setuFIDataResponse:
      type: object
      description: Response model for a GET FI data request in the Setu AA Sandbox
      properties:
        consentId:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"
        id:
          type: string
          description: Unique identifier for the consent request
          example: "cffe6e11-7277-498c-a370-f436276f4fc0"
        fips:
          type: array
          description: List/Array of FIPs
          $ref: '#/components/schemas/fips'

    fips:
      type: object
      description: List of Accounts
      properties:
        accounts:
          type: array
          description: List/Array of Accounts
          $ref: '#/components/schemas/accounts'

    accounts:
      type: object
      description: List of Account Data
      properties:
        accountData:
          type: array
          description: List/Array of Accounts
          $ref: '#/components/schemas/accountData'

    accountData:
      type: object
      description: FI Account Data Object
      properties:
        account:
          type: object
          description: Nested Object of Account Data
          $ref: '#/components/schemas/account'

    account:
      type: object
      additionalProperties: true
      discriminator:
        propertyName: type
        mapping:
          equities: '#/components/schemas/equityAccount'
      #          deposit: '#/components/schemas/depositAccount'
      properties:
        linkedAccRef:
          type: string
        maskedAccNumber:
          type: string
        type:
          type: string
        version:
          type: string

    equityAccount:
      allOf:
        - $ref: '#/components/schemas/account'
        - type: object
          properties:
            profile:
              $ref: '#/components/schemas/equityProfile'
            summary:
              $ref: '#/components/schemas/equitySummary'

    equityProfile:
      type: object
      description: Profile details for the equity account
      properties:
        holders:
          $ref: '#/components/schemas/equityHolders'

    equityHolders:
      type: object
      description: Information regarding the account holding pattern and holders
      properties:
        type:
          type: string
          description: Holding pattern type (e.g., SINGLE, JOINT)
          example: "SINGLE"
        holder:
          type: array
          description: List of account holders
          items:
            $ref: '#/components/schemas/equityHolderDetails'

    equityHolderDetails:
      type: object
      description: Demographic and account details of an individual account holder
      properties:
        address:
          type: string
          description: Full address of the holder
          example: "H.No. 652 Ahluwalia Ganj, Sirsa 267798"
        ckycCompliance:
          type: string
          description: CKYC compliance status (true/false as string)
          example: "true"
        dob:
          type: string
          format: date
          description: Date of birth of the holder in YYYY-MM-DD format
          example: "2005-04-18"
        email:
          type: string
          format: email
          description: Email address of the holder
          example: "ojas56@setu-dummy.com"
        mobile:
          type: string
          description: Mobile number of the holder
          example: "8225793173"
        name:
          type: string
          description: Full name of the holder
          example: "Alisha Upadhyay"
        nominee:
          type: string
          description: Nominee registration status
          example: "REGISTERED"
        pan:
          type: string
          description: PAN (Permanent Account Number) of the holder
          example: "YJEQG4123X"
        dematId:
          type: string
          description: Demat account identifier
          example: "IN303760GB77ELSJ"
        boId:
          type: string
          description: Beneficial Owner Identification Number
          example: "GB77ELSJ"
        dpId:
          type: string
          description: Depository Participant Identification Number
          example: "IN303760"
        brokerName:
          type: string
          description: Name of the broker/DP
          example: "AMRAPALI CAPITAL AND FINANCE SERVICES LIMITED"

    equitySummary:
      type: object
      description: Summary of the equity account and overall investment values
      properties:
        investment:
          $ref: '#/components/schemas/equityInvestment'
        currentValue:
          type: string
          description: Total current market value of the investments
          example: "464.34"
        investmentValue:
          type: string
          description: Total initial investment value
          example: "248108.62999999998"

    equityInvestment:
      type: object
      description: Details regarding the equity investments
      properties:
        holdings:
          $ref: '#/components/schemas/equityHoldingsList'

    equityHoldingsList:
      type: object
      description: Wrapper for the list of individual holdings
      properties:
        holding:
          type: array
          description: List of individual holdings
          items:
            $ref: '#/components/schemas/equityHoldings'

    equityHoldings:
      type: object
      description: Details of a single equity holding
      properties:
        description:
          type: string
          description: Description or remarks regarding the holding
          example: ""
        investmentDateTime:
          type: string
          format: date-time
          description: The date and time when the investment was recorded
          example: "2021-02-01T12:29:20+00:00"
        isin:
          type: string
          description: ISIN (International Securities Identification Number) of the security
          example: "GB66YYYX4416"
        issuerName:
          type: string
          description: Name of the issuer or company
          example: "Dhar and Sons"
        lastTradedPrice:
          type: string
          description: The last traded price (LTP) of the security
          example: "238.64"
        rate:
          type: string
          description: The rate or average price at which the holding was acquired
          example: "130.79"
        units:
          type: string
          description: The number of units or shares held
          example: "1897"












