      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user with their registered Email and returns a JWT token if the account is verified.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/emailLoginRequest'
      responses:
