        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose liabilities are being retrieved
          schema:
            type: long
      responses:
        '200':
          description: Successfully retrieved user liabilities.
          content:
            application/json:
              schema:
                title: liabilityDTOResponse
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    title: liabilityResponseDetails
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/liabilityDTO'
